[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SECSpy"
version = "0.1.0"
description = "Spherical Elementary Current System modelling tools for ionospheric equivalent currents."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Simon Walker" },
]
dependencies = [
    "numpy",
    "scipy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
data = [
    "apexpy",
    "joblib",
    "pandas",
    "tqdm",
    "xarray",
]
plotting = [
    "matplotlib",
    "pillow",
]

ezie = [
    "apexpy",
    "joblib",
    "pandas",
    "tqdm",
    "xarray",
    "matplotlib",
    "pillow",
    "secsy @ git+https://github.com/klaundal/secsy.git",
    "polplot @ git+https://github.com/klaundal/polplot.git",
]

video = [
    "pillow",
]
all = [
    "apexpy",
    "xarray",
    "joblib",
    "matplotlib",
    "secsy @ git+https://github.com/klaundal/secsy.git",
    "polplot @ git+https://github.com/klaundal/polplot.git",
    "pandas",
    "pillow",
    "tqdm",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["SECSpy*"]

[tool.setuptools.package-data]
SECSpy = ["assets/natural_earth_npz/*.npz", "assets/supermag-stations.csv"]
